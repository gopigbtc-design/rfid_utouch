name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Generate Gradle wrapper
        working-directory: android
        run: |
          curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew
          curl -fsSL -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradlew.bat
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: isens-rfid-handheld-apk
          path: build/app/outputs/flutter-apk/app-release.apk
