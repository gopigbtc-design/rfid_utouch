name: isens_rfid_handheld
description: ISENS RFID Cold Storage Tracking System - Handheld Scanner App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  # To use your real ISENS logo later, drop the PNG at
  # assets/images/isens_logo.png and uncomment the two lines below.
  # assets:
  #   - assets/images/isens_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  # Drop your app icon PNG at assets/icon/app_icon.png and uncomment,
  # then run: dart run flutter_launcher_icons
  # image_path: "assets/icon/app_icon.png"
